<!DOCTYPE html>

{% load i18n %}

{% load static %}

<html>
  <head>
    <title>

      {% block head_title %}
      {% endblock head_title %}
    </title>
    <meta name="viewport"
          content="width=device-width, initial-scale=1" />
    <link href="{% static "css/main.css" %}" rel="stylesheet" />
    <link href="{% static "css/bootstrap.min.css" %}" rel="stylesheet" />
  </head>
  <body>
    <main class="main-container row justify-content-center">
      {% if messages %}
        <div class="alert alert-info position-absolute top-0 start-50 w-75 translate-middle-x"
             role="alert">
          {% for message in messages %}
            <p>
              {{ message }}
            </p>
          {% endfor %}
        </div>
      {% endif %}
      <div class="col-sm-12 col-xl-5 col-gl-5 vh-100 d-flex justify-content-center align-items-center">
        <div class="container-md">
          <div class="row d-flex justify-content-center">
            <div class="col-12 col-md-7 col-lg-7">
              <div class="card bg-white">
                <div class="card-body p-4">

                  {% block content %}
                  {% endblock content %}
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
    <script src="{% static "script/bootstrap.min.js" %}"> </script>

    {% block js_code %}
    {% endblock js_code %}
  </body>
</html>
