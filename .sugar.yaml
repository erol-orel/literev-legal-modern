backend: compose
env-file: .env
defaults:
  group: ${{ env.SUGAR_ENV or env.ENV }}
  project-name: literev-legal${{ env.DOCKER_PROJECT_NAME }}
groups:
  prod:
    config-path:
      - containers/compose.base.yaml
      - containers/compose.prod.yaml
      - containers/compose.elasticsearch.yaml
    env-file: .env
    services:
      default: literev,literev-postgres,literev-redis,literev-celery,literev-nginx,certbot,elasticsearch
      available:
        - name: literev
        - name: literev-postgres
        - name: literev-redis
        - name: literev-celery
        - name: literev-nginx
        - name: certbot
        - name: elasticsearch

  dev:
    config-path:
      - containers/compose.base.yaml
      - containers/compose.dev.yaml
      - containers/compose.elasticsearch.yaml
    env-file: .env
    services:
      default: literev,literev-postgres,literev-redis,literev-celery
      available:
        - name: literev
        - name: literev-postgres
        - name: literev-redis
        - name: literev-celery
        - name: literev-elasticsearch

  dev-host:
    config-path:
      - containers/compose.base.yaml
      - containers/compose.dev.yaml
    env-file: .env
    services:
      default: literev-postgres,literev-redis,literev-celery
      available:
        - name: literev-postgres
        - name: literev-redis
        - name: literev-celery

  test:
    config-path:
      - containers/compose.base.yaml
      - containers/compose.dev.yaml
    env-file: .env
    services:
      default: literev-postgres,literev-redis
      available:
        - name: literev-postgres
        - name: literev-redis
