exclude: "^docs/|/migrations/|devcontainer.json"
default_stages: [pre-commit]

default_language_version:
  python: python3.11

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-json
      - id: check-toml
      - id: check-xml
      - id: debug-statements
      - id: check-builtin-literals
      - id: check-case-conflict
      - id: check-docstring-first
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      # Blocks committing secrets locally, before they ever reach the remote.
      - id: gitleaks

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: "v3.0.2"
    hooks:
      - id: prettier

  - repo: https://github.com/Riverside-Healthcare/djLint
    rev: v1.32.1
    hooks:
      - id: djlint-reformat-django
        files: "\\.html"
        types_or: ["html"]
        # it is necessary to exclude src/backend/literev/templates/tags because of the
        # following issue:
        #   - https://github.com/Riverside-Healthcare/djLint/issues/703
        # src/frontend is excluded because index.html is a Vite template, not a
        # Django template — djlint reformats it in ways Vite/prettier disagree with.
        exclude: "src/backend/workflow/tests|.git|docs|.eggs|src/backend/literev/templates/tags|src/frontend"
      - id: djlint-django
        files: "\\.html"
        types_or: ["html"]
        # it is necessary to exclude src/backend/literev/templates/tags because of the
        # following issue:
        #   - https://github.com/Riverside-Healthcare/djLint/issues/703
        exclude: "src/backend/workflow/tests|.git|docs|.eggs|src/backend/literev/templates/tags"

  - repo: local
    hooks:
      - id: ruff-format
        name: ruff-format
        entry: ruff format --no-force-exclude
        language: system
        pass_filenames: true
        types:
          - python

      - id: ruff-linter
        name: ruff-linter
        entry: ruff check
        language: system
        exclude: "docs/|migrations/.*|literev/urls.py"
        pass_filenames: true
        types:
          - python

      - id: bandit
        name: bandit
        entry: bandit
        language: system
        args: ["--configfile", "pyproject.toml", "-iii", "-lll"]
        pass_filenames: true
        types:
          - python

      - id: vulture
        name: vulture
        entry: python scripts/run-vulture.py
        language: system
        description: Find unused Python code.
        pass_filenames: false
        types:
          - python

      # note: mccabe doesn't return a error code 1 when it finds functions with
      #       high complexity
      - id: mccabe
        name: mccabe
        # note: it would be nice to move this threshold to 10
        entry: python -m mccabe --min 25
        language: system
        files: "src/"
        pass_filenames: true
        types:
          - python

      - id: mypy
        name: mypy
        entry: ./scripts/run-mypy-precommit.sh
        language: system
        pass_filenames: false
        require_serial: true
