version: 2
updates:
  # Python backend + libraries
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]

  # React frontend
  - package-ecosystem: npm
    directory: "/src/frontend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]

  # GitHub Actions used by workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  # Base container images
  - package-ecosystem: docker
    directory: "/containers/postgresql"
    schedule:
      interval: weekly
