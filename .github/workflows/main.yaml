  PUBMEDCENTRAL_REQUEST_TIME_INTERVAL: 0.5
  DOCKER_VOLUME_CONTAINER_PATH: /opt/data/literev
  USE_CONTAINER: True

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python_version: ["3.10"]
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true

    defaults:
      run:
        shell: bash -l {0}

    steps:
    - uses: actions/checkout@v3

    - uses: conda-incubator/setup-miniconda@v3
      with:
        miniconda-version: "latest"
        environment-file: conda/base.yaml
        channels: conda-forge,nodefaults
        activate-environment: literev-legal
        auto-update-conda: true
        conda-solver: libmamba

    - name: Create environment variables files
      run: |
        export FRONTEND_HOST_PORT=${FRONTEND_HOST_PORT}
        export POSTGRES_PORT=${POSTGRES_PORT}
        export DOCKER_PROJECT_NAME=$RANDOM
        export HOST_UID=${HOST_UID}
        export HOST_GID=${HOST_GID}
        export USE_CONTAINER=True
        cd /home/runner/work/literev-legal/literev-legal/
        envsubst < .env.tpl > .env

    - name: Check if poetry.lock is updated
      run: poetry check

    - name: Install dependencies
      run: poetry install

    # - name: Run linter
    #   if: ${{ success() || failure() }}
    #   run: makim tests.lint

    - name: Clean-up and Setup
      run: |
        makim clean.all
        makim containers.host-setup

    - name: Remove old database
      run: sugar down --options --volumes || true

    - name: Build images
      run: sugar build --services literev-postgres

    - name: Start literev-postgres container
      run: sugar ext start --services literev-postgres --options -d

    - name: Migrate containers
      run: makim django.migrate

    - name: Health check
      run: |
        sleep 10
        docker ps
        # makim containers.wait-all

    - name: Check migration files
      if: ${{ success() || failure() }}
      run: makim --verbose django.makemigrations --check

    - name: Run tests
      if: ${{ success() || failure() }}
      run: makim tests.unittest --module literev/tests

    - name: Stop services
      run: |
        sugar stop
        sugar down --options --volumes

    - name: Semantic Release PR Title Check
      uses: osl-incubator/semantic-release-pr-title-check@v1.4.1
      if: ${{ success() || failure() }}
      with:
        convention-name: conventionalcommits
