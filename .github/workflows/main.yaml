name: main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  HOST_UID: 1000
  HOST_GID: 1000
  DOCKER_CPU_LIMIT: 1.0
  DOCKER_CPU_RESERVATION: 0.5
  LITEREV_USE_MULTIPROCESSING: false
  NUMBER_ARTICLE_BY_PAGE: 30
  NUMBER_THREADS_ALLOWED: 4
  NUMBER_TRIALS: 2
  NUMBER_OPTUNA_JOBS: 5
  ENV: dev
  DEBUG: True
  DJANGO_SETTINGS_MODULE: config.settings.dev
  DJANGO_SECRET_KEY: "django-insecure-96*q09uh20(^i4sdxqh3n_v#d-o:**7zrri&k-j3@f10hm88)"
  DJANGO_ENV: dev
  ES_HOST_URL: "http://es.literev.com:9201"
  ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
  ES_USERNAME: "elastic"
  FRONTEND_HOST_PORT: 8000
  POSTGRES_PORT: 35432
  POSTGRES_HOST: localhost
  POSTGRES_DB: postgres
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB_LITEREV: literev
  POSTGRES_USER_LITEREV: literev
  # Ephemeral throwaway password for the CI-only database (dropped with the
  # container at job end). Not a real credential; real passwords come from
  # deploy-time secrets, never from this file.
  POSTGRES_PASSWORD_LITEREV: ci_ephemeral_pg_pw
  POSTGRES_DATA: /tmp/literev/postgres
  POSTGRES_HOST_BACKUP: /tmp/literev/backup
  CONTAINER_VOLUME_DATA_DIR: /tmp/literev
  STATIC_ROOT: /tmp/literev/static
  MEDIA_ROOT: /tmp/literev/static/media
  LITEREV_CACHE_DIR: /tmp/literev/cache
  LITEREV_LOGS_DIR: /tmp/literev/logs
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  CERTBOT_EMAIL: ci@literev.unige.ch
  CERTBOT_DOMAIN: literev.unige.ch
  ACTIONS_RUNNER_DEBUG: true
  PUBMED_REQUEST_TIME_INTERVAL: 0.5
  PUBMEDCENTRAL_REQUEST_TIME_INTERVAL: 0.5
  USE_CONTAINER: False
  SUGAR_ENV: test
  REDIS_PORT: 6379
  REDIS_HOST: localhost
  REDIS_DB: 0
  REDIS_USERNAME: app
  CLUSTERING_MIN_DOCUMENTS: 20
  MIN_CONFIDENCE: 0.0
  LITEREV_CHAMBER_NAMES: "chambre_penale,chambre_civile"

jobs:
  check_branch:
    name: Check if branch is ahead of main
    runs-on: ubuntu-latest
    steps:
      - name: Skip on push
        if: ${{ github.event_name != 'pull_request' }}
        run: echo "Branch freshness check only applies to pull requests."

      - name: Checkout
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch main
        if: ${{ github.event_name == 'pull_request' }}
        run: git fetch origin main

      - name: Check if branch is ahead of main
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "::error::This branch is not up to date with main; please rebase or merge."
            exit 1
          fi

  linter:
    name: Linter
    needs: check_branch
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    timeout-minutes: 60
    concurrency:
      group: ci-main-linter-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Dir setup
        run: |
          export HOST_UID=$(id -u)
          export HOST_GID=$(id -g)
          BASE_DIR=/tmp/literev

          for dir in articles cache logs plot pkl static; do
            sudo mkdir -p "${BASE_DIR}/${dir}"
          done

          sudo mkdir -p /opt/data/literev
          sudo chown -R "${HOST_UID}:${HOST_GID}" "${BASE_DIR}" /opt/data/literev

      - name: Install Operating System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install gettext-base

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: conda/base.yaml
          condarc-file: .github/workflows/.condarc
          micromamba-binary-path: ${{ runner.temp }}/bin/micromamba
          micromamba-root-path: ${{ runner.temp }}/micromamba
          environment-name: literev
          generate-run-shell: false
          create-args: -v
          init-shell: bash
          post-cleanup: all

      - name: Create environment variables files
        run: |
          export FRONTEND_HOST_PORT=${FRONTEND_HOST_PORT}
          export POSTGRES_PORT=${POSTGRES_PORT}
          export DOCKER_PROJECT_NAME=$RANDOM
          export HOST_UID=${HOST_UID}
          export HOST_GID=${HOST_GID}
          envsubst < .env.tpl > .env

      - name: Clean broken certifi metadata
        run: |
          echo "Removing stray certifi dist-info so pip won't choke..."
          rm -rf "${CONDA_PREFIX}/lib/python3.10/site-packages"/certifi-*.dist-info

      - name: Install dependencies
        run: ./scripts/install-dev.sh

      - name: Run linter
        run: makim tests.lint

  import_boundaries:
    name: Import Boundaries
    needs: check_branch
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        if: ${{ github.event_name == 'pull_request' }}
        uses: dorny/paths-filter@v3
        with:
          filters: |
            should_run:
              - 'libs/**'
              - 'scripts/check_import_boundaries.py'
              - 'tests/import_boundaries/**'
              - 'pyproject.toml'
              - '.makim.yaml'
              - '.github/workflows/**'
              - 'conda/**'
              - 'scripts/install-dev.sh'

      - name: Dir setup
        if: ${{ github.event_name == 'push' || steps.filter.outputs.should_run == 'true' }}
        run: |
          export HOST_UID=$(id -u)
          export HOST_GID=$(id -g)
          BASE_DIR=/tmp/literev

          for dir in articles cache logs plot pkl static; do
            sudo mkdir -p "${BASE_DIR}/${dir}"
          done

          sudo mkdir -p /opt/data/literev
          sudo chown -R "${HOST_UID}:${HOST_GID}" "${BASE_DIR}" /opt/data/literev

      - name: Install Operating System dependencies
        if: ${{ github.event_name == 'push' || steps.filter.outputs.should_run == 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install gettext-base

      - if: ${{ github.event_name == 'push' || steps.filter.outputs.should_run == 'true' }}
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: conda/base.yaml
          condarc-file: .github/workflows/.condarc
          micromamba-binary-path: ${{ runner.temp }}/bin/micromamba
          micromamba-root-path: ${{ runner.temp }}/micromamba
          environment-name: literev
          generate-run-shell: false
          create-args: -v
          init-shell: bash
          post-cleanup: all

      - name: Create environment variables files
        if: ${{ github.event_name == 'push' || steps.filter.outputs.should_run == 'true' }}
        run: |
          export FRONTEND_HOST_PORT=${FRONTEND_HOST_PORT}
          export POSTGRES_PORT=${POSTGRES_PORT}
          export DOCKER_PROJECT_NAME=$RANDOM
          export HOST_UID=${HOST_UID}
          export HOST_GID=${HOST_GID}
          envsubst < .env.tpl > .env

      - name: Clean broken certifi metadata
        if: ${{ github.event_name == 'push' || steps.filter.outputs.should_run == 'true' }}
        run: |
          echo "Removing stray certifi dist-info so pip won't choke..."
          rm -rf "${CONDA_PREFIX}/lib/python3.10/site-packages"/certifi-*.dist-info

      - name: Install dependencies
        if: ${{ github.event_name == 'push' || steps.filter.outputs.should_run == 'true' }}
        run: ./scripts/install-dev.sh

      - name: Run import boundary suite
        if: ${{ github.event_name == 'push' || steps.filter.outputs.should_run == 'true' }}
        run: makim tests.import-boundaries

  lib_tests:
    name: Lib Tests (${{ matrix.lib }})
    needs: check_branch
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        lib:
          - lr-contracts
          - lr-query
          - lr-search
          - lr-preprocessing
          - lr-clustering
          - lr-rag
          - lr-refinement
          - lr-legal
    steps:
      - uses: actions/checkout@v4

      - name: Dir setup
        run: |
          export HOST_UID=$(id -u)
          export HOST_GID=$(id -g)
          BASE_DIR=/tmp/literev

          for dir in articles cache logs plot pkl static; do
            sudo mkdir -p "${BASE_DIR}/${dir}"
          done

          sudo mkdir -p /opt/data/literev
          sudo chown -R "${HOST_UID}:${HOST_GID}" "${BASE_DIR}" /opt/data/literev

      - name: Install Operating System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install gettext-base

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: conda/base.yaml
          condarc-file: .github/workflows/.condarc
          micromamba-binary-path: ${{ runner.temp }}/bin/micromamba
          micromamba-root-path: ${{ runner.temp }}/micromamba
          environment-name: literev
          generate-run-shell: false
          create-args: -v
          init-shell: bash
          post-cleanup: all

      - name: Create environment variables files
        run: |
          export FRONTEND_HOST_PORT=${FRONTEND_HOST_PORT}
          export POSTGRES_PORT=${POSTGRES_PORT}
          export DOCKER_PROJECT_NAME=$RANDOM
          export HOST_UID=${HOST_UID}
          export HOST_GID=${HOST_GID}
          envsubst < .env.tpl > .env

      - name: Clean broken certifi metadata
        run: |
          echo "Removing stray certifi dist-info so pip won't choke..."
          rm -rf "${CONDA_PREFIX}/lib/python3.10/site-packages"/certifi-*.dist-info

      - name: Install dependencies
        run: ./scripts/install-dev.sh

      - name: Run lib suite
        run: makim tests.lib --lib ${{ matrix.lib }}

      - name: Build coverage summary
        if: ${{ always() && !cancelled() }}
        run: |
          mkdir -p coverage-reports
          OUT="coverage-reports/coverage-lib-${{ matrix.lib }}.md"
          {
            echo "### Lib \`${{ matrix.lib }}\`"
            echo ""
            if [[ -f .coverage ]]; then
              echo '```'
              coverage report -m --skip-empty \
                --include="libs/${{ matrix.lib }}/src/**" 2>&1 || true
              echo '```'
            else
              echo "_No coverage data produced._"
            fi
          } > "$OUT"

      - name: Upload coverage summary
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lib-${{ matrix.lib }}
          path: coverage-reports/coverage-lib-${{ matrix.lib }}.md
          if-no-files-found: warn
          retention-days: 7

  app_tests:
    name: App Tests
    needs: check_branch
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    timeout-minutes: 120
    concurrency:
      group: ci-main-app-tests-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Dir setup
        run: |
          export HOST_UID=$(id -u)
          export HOST_GID=$(id -g)
          BASE_DIR=/tmp/literev

          for dir in articles cache logs plot pkl static; do
            sudo mkdir -p "${BASE_DIR}/${dir}"
          done

          sudo mkdir -p /opt/data/literev
          sudo chown -R "${HOST_UID}:${HOST_GID}" "${BASE_DIR}" /opt/data/literev

      - name: Install Operating System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install gettext-base

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: conda/base.yaml
          condarc-file: .github/workflows/.condarc
          micromamba-binary-path: ${{ runner.temp }}/bin/micromamba
          micromamba-root-path: ${{ runner.temp }}/micromamba
          environment-name: literev
          generate-run-shell: false
          create-args: -v
          init-shell: bash
          post-cleanup: all

      - name: Create environment variables files
        run: |
          export FRONTEND_HOST_PORT=${FRONTEND_HOST_PORT}
          export POSTGRES_PORT=${POSTGRES_PORT}
          export DOCKER_PROJECT_NAME=$RANDOM
          export HOST_UID=${HOST_UID}
          export HOST_GID=${HOST_GID}
          envsubst < .env.tpl > .env

      - name: Clean broken certifi metadata
        run: |
          echo "Removing stray certifi dist-info so pip won't choke..."
          rm -rf "${CONDA_PREFIX}/lib/python3.10/site-packages"/certifi-*.dist-info

      - name: Install dependencies
        run: ./scripts/install-dev.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: makim reactjs.install

      - name: Run frontend unit tests
        run: makim tests.reactjs

      - name: Generate Redis ACL config & password
        run: |
          makim containers.redis-setup
          echo "REDIS_PASSWORD=$(cat containers/redis/config/redis.pass)" >> "$GITHUB_ENV"

      - name: Start test Redis
        run: |
          docker rm -f test-redis 2>/dev/null || true
          docker run -d --name test-redis -p 6379:6379 \
            -v "$PWD/containers/redis/config:/usr/local/etc/redis:ro" \
            redis:7-alpine redis-server /usr/local/etc/redis/redis.conf

          PASS="$(cat containers/redis/config/redis.pass)"
          for i in {1..30}; do
            if docker exec test-redis redis-cli --user app --pass "$PASS" PING | grep -q PONG; then
              echo "Redis is ready"
              break
            fi
            sleep 1
          done

      - name: Clean-up
        run: makim clean.all

      - name: Remove old database
        run: sugar compose down -- --volumes || true

      - name: Build images
        run: sugar compose build --services literev-postgres

      - name: Start literev-postgres container
        run: sugar compose-ext start -- -d

      - name: Migrate containers
        run: makim django.migrate

      - name: Check migration files
        if: ${{ success() || failure() }}
        run: makim --verbose django.makemigrations --check

      - name: Run app suite
        run: makim tests.app

      - name: Build coverage summary
        if: ${{ always() && !cancelled() }}
        run: |
          mkdir -p coverage-reports
          OUT="coverage-reports/coverage-app.md"
          {
            python scripts/render_frontend_coverage_summary.py \
              --summary-path src/frontend/coverage/coverage-summary.json
            echo ""
            echo "### App tests"
            echo ""
            if [[ -f .coverage ]]; then
              echo '```'
              coverage report -m --skip-empty \
                --include="src/backend/**" 2>&1 || true
              echo '```'
            else
              echo "_No app coverage data produced._"
            fi
          } > "$OUT"

      - name: Upload coverage summary
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-app
          path: coverage-reports/coverage-app.md
          if-no-files-found: warn
          retention-days: 7

      - name: Show Logs
        if: ${{ failure() }}
        run: sugar compose logs -- -n 100

      - name: Stop services
        if: ${{ success() || failure() }}
        run: |
          docker rm -f test-redis 2>/dev/null || true
          sugar compose stop
          sugar compose down -- --volumes

  coverage_report:
    name: Coverage PR Comment
    needs: [lib_tests, app_tests]
    if: ${{ always() && !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Download coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage-reports
          merge-multiple: true

      - name: Build comment body
        shell: bash
        run: |
          set -euo pipefail
          BODY=/tmp/coverage-comment.md
          libs=(
            lr-contracts
            lr-query
            lr-search
            lr-preprocessing
            lr-clustering
            lr-rag
            lr-refinement
            lr-legal
          )
          {
            echo "## Coverage summary"
            echo ""
            echo "_Per-job coverage report for this pull request._"
            echo ""
            echo "- Run: [#${GITHUB_RUN_NUMBER}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo ""

            if [[ -f coverage-reports/coverage-app.md ]]; then
              cat coverage-reports/coverage-app.md
            else
              echo "### App tests"
              echo ""
              echo "_Not run in this PR._"
            fi
            echo ""

            for lib in "${libs[@]}"; do
              f="coverage-reports/coverage-lib-${lib}.md"
              if [[ -f "$f" ]]; then
                cat "$f"
              else
                echo "### Lib \`${lib}\`"
                echo ""
                echo "_Not run in this PR._"
              fi
              echo ""
            done
          } > "$BODY"

      - name: Post sticky comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: coverage-report
          path: /tmp/coverage-comment.md

  semantic_release_pr_title_check:
    name: Semantic Release PR Title Check
    if: ${{ github.event_name == 'pull_request' }}
    needs: check_branch
    runs-on: ubuntu-latest
    steps:
      - uses: osl-incubator/semantic-release-pr-title-check@v1.4.1
        with:
          convention-name: conventionalcommits
