name: Release
on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches:  [ main ]

jobs:
  release:
    if: ${{ !github.event.pull_request.draft }}
    name: Release
    runs-on: self-hosted
    timeout-minutes: 50

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: conda/release.yaml
          condarc-file: .github/workflows/.condarc
          micromamba-binary-path: ${{ runner.temp }}/bin/micromamba
          micromamba-root-path: ${{ runner.temp }}/micromamba
          environment-name: literev-release
          generate-run-shell: false
          create-args: -v
          init-shell: >-
            bash
          # cache-environment: true
          post-cleanup: 'all'

      - name: Create file with environment variables
        run: touch .env

      - name: Install dependencies
        run: ./scripts/install-dev.sh

      - name: Set npm proxy configuration
        run: |
          npm config set proxy $HTTP_PROXY
          npm config set https-proxy $HTTPS_PROXY

      - name: Update npm
        run: npm -g update npm

      - name: Run semantic release (for tests)
        if: ${{ github.event_name != 'workflow_dispatch' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: makim release.dry

      - name: Release command
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          makim release.ci
