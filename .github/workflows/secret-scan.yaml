name: secret-scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install gitleaks
        run: |
          version="8.21.2"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          curl -sSL "$url" | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # Scan the working tree (--no-git) so the check enforces "no secret in the
      # current sources" without failing on pre-existing history. New secrets in
      # any changed file are caught before they can merge.
      - name: Scan working tree for secrets
        run: >
          gitleaks detect
          --no-git
          --source .
          --config .gitleaks.toml
          --redact
          --verbose
          --exit-code 1
