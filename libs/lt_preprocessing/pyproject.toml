[build-system]
requires = ["setuptools>=70.1.0,<80.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lt-preprocessing"
version = "0.12.0"  # semantic-release
description = "French-language preprocessing, cleanup, and n-gram helpers for literev."
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [
  {name = "Aziza", email = "FatmaAziza.Merzouki@unige.ch"},
  {name = "Erol", email = "Erol.Orel@unige.ch"},
  {name = "Ivan Ogasawara", email = "ivan.ogasawara@gmail.com"},
]
dependencies = [
  "lingua-language-detector >=2.0.2",
  "scikit-learn >=1.5.0",
  "spacy >=3.8.0,<3.9",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["lt_preprocessing*"]

[tool.setuptools.package-data]
lt_preprocessing = [
  "py.typed",
  "data/**",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["tests.py", "test_*.py"]
