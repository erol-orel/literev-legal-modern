version: 1.0
shell: bash
env-file: .env
groups:
  clean:
    targets:
      all:
        help: remove build artifacts, compiled files, and cache
        shell: bash
        run: |
          find . -name '*.egg-info' -exec rm -rf {} +
          find . -name '*.egg' -exec rm -f {} +
          find . -name '*.pyc' -exec rm -f {} +
          find . -name '*.pyo' -exec rm -f {} +
          find . -name '__pycache__' -exec rm -rf {} +
          find . -name '*~' -exec rm -f {} +
          rm -rf build/
          rm -rf dist/
          rm -rf .eggs/
          rm -f .coverage
          rm -rf htmlcov/
          rm -rf .pytest_cache
          rm -rf .mypy_cache
          rm -rf .ruff_cache

  tests:
    targets:
      lint:
        help: Run linter tools
        dependencies:
          - target: clean.all
        run: |
          pre-commit install
          pre-commit run --all-files --verbose

  django:
    targets:
      collectstatic:
        help: Run the collectstatic for the literev service
        run: |
          CMD="python manage.py collectstatic --no-input"

          if [[ "${{ env.USE_CONTAINER }}" == "true" ]]; then
            sugar run --service literev --options --rm --cmd $CMD
          else
            cd ./src/
            export POSTGRES_HOST=localhost
            $CMD
          fi

      create-superuser:
        args:
          email:
            help: Specify the username
            type: string
            required: True
          username:
            help: Specify the username
            type: string
            required: True
          password:
            help: Specify the password
            type: string
            required: True
        env:
          POSTGRES_HOST: localhost
        help: create an admin user
        run: |
          export DJANGO_SUPERUSER_PASSWORD=${{ args.password }}
          export DJANGO_SUPERUSER_USERNAME=${{ args.username }}
          CMD="python manage.py createsuperuser --noinput --email ${{ args.email }}"

          if [[ "${{ env.USE_CONTAINER }}" == "true" ]]; then
            sugar run --service literev --cmd $CMD --options --rm --env DJANGO_SUPERUSER_PASSWORD=$DJANGO_SUPERUSER_PASSWORD --env DJANGO_SUPERUSER_USERNAME=$DJANGO_SUPERUSER_USERNAME
          else
            cd ./src/
            export POSTGRES_HOST=localhost
            $CMD
          fi

      makemigrations:
        help: Run django makemigrations command (just for development)
        args:
          check:
            help: |
              Just check if the latest migration files were already created.
            type: bool
            action: store_true
        run: |
          sugar ext start \
            --services literev-postgres --options -d

          CWD=$(pwd)
          CMD_FLAG="${{ '--check' if args.check else '' }} --no-input"

          for app in 'literev'; do
            echo -e "\nMaking migration files for: '${app}' ...\n"

            CMD="python manage.py makemigrations ${CMD_FLAG} ${app}"

            if [[ "${{ env.USE_CONTAINER }}" == "true" ]]; then
              sugar run --service literev --options --rm --cmd $CMD
            else
              cd "${CWD}/src/"
              export POSTGRES_HOST=localhost
              $CMD
            fi
          done

          echo "[II] literev-postgres is running."

      migrate:
        help: Migrate regarding to the current migration files
        env-file: .env
        run: |
          sugar ext start \
            --services literev-postgres --options -d

          CMD="python manage.py migrate --no-input"

          if [[ "${{ env.USE_CONTAINER }}" == "true" ]]; then
            sugar run --service literev --options --rm --cmd $CMD
          else
            cd ./src/
            export POSTGRES_HOST=localhost
            $CMD
          fi
          echo "[II] literev-postgres is running."

      runserver:
        help: Run the django application
        env-file: .env
        args:
          plus:
            help: Run runserver command with additionally resources.
            type: bool
            action: store-true
        run: |
          sugar ext restart --services literev --options -d
          {% if args.plus %}
          CMD="python manage.py runserver_plus 0.0.0.0:8000"
          {% else %}
          CMD="python manage.py runserver 0.0.0.0:8000"
          {% endif %}

          if [[ "${{ env.USE_CONTAINER }}" == "true" ]]; then
            sugar run --service literev --options --rm
          else
            cd src
            export POSTGRES_HOST=localhost
            $CMD
          fi

      optimize-documents:
        help: Run the optimization of the documents
        env-file: .env
        run: |
          sugar ext start \
            --services literev-postgres --options -d

          CMD="python manage.py optimize_documents"

          if [[ "${{ env.USE_CONTAINER }}" == "true" ]]; then
            sugar run --service literev --options --rm --cmd $CMD
          else
            cd ./src/
            export POSTGRES_HOST=localhost
            $CMD
          fi
          echo "[II] The optimization of the documents is done."

      fetch-documents:
        help: Run the optimization of the documents
        env-file: .env
        run: |
          sugar ext start \
            --services literev-postgres --options -d

          CMD="python manage.py fetch_documents"

          if [[ "${{ env.USE_CONTAINER }}" == "true" ]]; then
            sugar run --service literev --options --rm --cmd $CMD
          else
            cd ./src/
            export POSTGRES_HOST=localhost
            $CMD
          fi
          echo "[II] Access to DB granted."

      optimize-documents-local:
        help: Run the optimization of the documents (temporary)
        env-file: .env
        run: |
          export POSTGRES_HOST=localhost
          cd ./src/
          python manage.py optimize_documents
          echo "[II] The optimization of the documents is done."

      notebook:
        help: Run the django environment in a jupyter notebook
        env-file: .env
        run: |
          export POSTGRES_HOST=localhost
          python src/manage.py shell_plus --lab

      shell:
        help: Run the Django console interpreter inside the container.
        env-file: .env
        run: |
          export POSTGRES_HOST=localhost
          python src/manage.py shell

  containers:
    targets:
      wait:
        args:
          timeout:
            help: Specify the timeout for waiting the services
            type: integer
            default: 90
          service:
            help: Specify the service to be awaited
            type: string
            required: true
        run: timeout ${{ args.timeout }} ./containers/healthcheck.sh ${{ args.service }}

      wait-all:
        help: wait for all services
        run: |
          makim containers.wait --service literev-postgres
          makim containers.wait --service literev

      host-setup:
        help: Prepare the host for running the containers
        env-file: .env
        run: |
          mkdir -p ${LITEREV_CACHE_DIR}
          mkdir -p ${DOCKER_VOLUME_CONTAINER_PATH}
          mkdir -p ${STATIC_ROOT}

  elasticsearch:
    targets:
      index-json:
        help: Load normalized sample data to Elasticsearch
        env-file: .env
        args:
          index-name:
            help: Specify the index name
            type: string
            required: false
            default: "judiciary"
          prepare-jsonl:
            help: Prepare the JSONL file if not present
            type: bool
            default: true
          json-path:
            help: Specify the JSON file path if the default file is not found
            type: string
            required: false
            default: "/opt/data/json_raw/output.jsonl"
        shell: python
        run: |
          import logging
          import os
          import time
          from pathlib import Path

          from elasticsearch import Elasticsearch
          from literev.libs.etl import DataLoader, DataReader

          # Setup logging
          logging.basicConfig(level=logging.INFO)
          logger = logging.getLogger(__name__)

          # Paths and directory
          DATA_DIR = Path("/opt/data/json_raw")
          DATA_DIR.mkdir(parents=True, exist_ok=True)
          RAW_JSONL_PATH = DATA_DIR / "output.jsonl"
          FINAL_JSONL_PATH = DATA_DIR / "judiciary_data.jsonl"

          # Elasticsearch configuration
          ES_JUDICIARY_INDEX_NAME = "${{ args.index_name }}"
          ES_HOST = "${{ env.ES_HOST_URL }}"
          ES_USER = "${{ env.ES_USER }}"
          ES_PASSWORD = "${{ env.ES_PASSWORD }}"

          # Initialize Elasticsearch client
          ES = Elasticsearch(
              [ES_HOST],
              basic_auth=(ES_USER, ES_PASSWORD),
          )

          # Check cluster health
          def is_cluster_ready(es_client):
              try:
                  health = es_client.cluster.health()
                  logger.info(f"Cluster Health: {health}")
                  return health['status'] in ['green', 'yellow']
              except Exception as e:
                  logger.error(f"Failed to retrieve cluster health due to: {e}")
                  return False

          # Wait for cluster to be ready
          max_retries = 10
          attempts = 0
          while not is_cluster_ready(ES) and attempts < max_retries:
              logger.info("Waiting for the cluster to become ready...")
              time.sleep(30)
              attempts += 1

          if attempts == max_retries:
              logger.error("Max retries reached. Cluster is not ready. Exiting.")
              exit(1)

          # Verify the existence of the raw JSONL file
          if not RAW_JSONL_PATH.exists():
              logger.warning(f"Default JSONL file not found at {RAW_JSONL_PATH}. Using specified file path.")
              RAW_JSONL_PATH = Path("${{ args.json_path }}")

              if not RAW_JSONL_PATH.exists():
                  logger.error(f"Specified JSONL file also not found at {RAW_JSONL_PATH}. Please provide a valid file path.")
                  exit(1)

          # Prepare JSONL file if necessary
          if not FINAL_JSONL_PATH.exists() or ${{ args.prepare_jsonl }}:
              logger.info("Starting JSONL parsing and export...")
              reader = DataReader(file_path=RAW_JSONL_PATH)
              data_loader = DataLoader(reader)
              data_loader.load_into_jsonl_file(export_path=FINAL_JSONL_PATH)
              logger.info("JSONL file prepared.")

          # Load data into Elasticsearch
          if FINAL_JSONL_PATH.exists():
              reader = DataReader(file_path=FINAL_JSONL_PATH)
              data_loader = DataLoader(reader)
              data_loader.load_into_es(
                  es_client=ES,
                  index_name=ES_JUDICIARY_INDEX_NAME
              )

              logger.info("Data loaded into Elasticsearch successfully!")

  release:
    vars:
      app: |
        npx --yes \
          -p semantic-release \
          -p conventional-changelog-conventionalcommits \
          -p "@semantic-release/commit-analyzer" \
          -p "@semantic-release/release-notes-generator" \
          -p "@semantic-release/changelog" \
          -p "@semantic-release/exec" \
          -p "@semantic-release/github" \
          -p "@semantic-release/git" \
          -p "semantic-release-replace-plugin@1.2.7" \
          semantic-release

    targets:
      ci:
        help: run semantic release on CI
        run: ${{ vars.app }} --ci

      dry:
        help: run semantic release in dry-run mode
        run: |
          ${{ vars.app }} --dry-run
