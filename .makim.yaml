version: 1.0
shell: bash
env-file: .env
groups:
  clean:
    tasks:
      all:
        help: remove build artifacts, compiled files, and cache
        shell: bash
        run: |
          find . -name '*.egg-info' -exec rm -rf {} +
          find . -name '*.egg' -exec rm -f {} +
          find . -name '*.pyc' -exec rm -f {} +
          find . -name '*.pyo' -exec rm -f {} +
          find . -name '__pycache__' -exec rm -rf {} +
          find . -name '*~' -exec rm -f {} +
          rm -rf build/
          rm -rf dist/
          rm -rf .eggs/
          rm -f .coverage
          rm -rf htmlcov/
          rm -rf .pytest_cache
          rm -rf .mypy_cache
          rm -rf .ruff_cache

  tests:
    tasks:
      lint:
        help: Run linter tools
        dependencies:
          - target: clean.all
        run: |
          pre-commit install
          pre-commit run --all-files --verbose
  tests:
    tasks:
      lint:
        help: Run linter tools
        dependencies:
          - task: clean.all
        run: |
          pre-commit install
          pre-commit run --all-files --verbose

      unittest:
        help: Run tests
        args:
          app:
            help: The name of the app (literev)
            type: string
          module:
            help: Specify the python module used for the test
            type: string
            default: ""
          settings:
            help: Specify the django settings module
            type: string
            default: ""
          params:
            help: Specify parameters to be used for tests
            type: string
            default: "-vvv"
        env-file: ./.env
        run: |
          CMD="pytest ${{ args.app or args.module }} \
            --ds=${{ args.settings or env.DJANGO_SETTINGS_MODULE }} ${{ args.params }}"
          if [[ "${{ env.USE_CONTAINER }}" == "true" ]]; then
            sugar exec --service literev --cmd $CMD
          else
            cd src/
            export POSTGRES_HOST=localhost
            $CMD
          fi

      unit-local:
        help: Run unit tests locally (host) with pytest
        args:
          app:
            help: The name of the app (workflow, literev, research)
            type: string
          module:
            help: Specify the python module used for the test
            type: string
            default: ""
          params:
            help: Specify additional parameters to be used for pytest
            type: string
            default: "-v"
        env-file: ./.env
        dir: src
        run: |
          CMD="pytest ${{ args.app or args.module }} \
            --ds=config.settings.dev ${{ args.params }}"
          export POSTGRES_HOST=localhost
          $CMD

  django:
    tasks:
      collectstatic:
        help: Run the collectstatic for the literev service
        run: |
          CMD="python manage.py collectstatic --no-input"

          if [[ "${{ env.USE_CONTAINER }}" == "true" ]]; then
            sugar run --service literev --options --rm --cmd $CMD
          else
            cd ./src/
            export POSTGRES_HOST=localhost
            $CMD
          fi

      create-superuser:
        args:
          email:
            help: Specify the username
            type: string
            required: True
          username:
            help: Specify the username
            type: string
            required: True
          password:
            help: Specify the password
            type: string
            required: True
        env:
          POSTGRES_HOST: localhost
        help: create an admin user
        run: |
          export DJANGO_SUPERUSER_PASSWORD=${{ args.password }}
          export DJANGO_SUPERUSER_USERNAME=${{ args.username }}
          CMD="python manage.py createsuperuser --noinput --email ${{ args.email }}"

          if [[ "${{ env.USE_CONTAINER }}" == "true" ]]; then
            sugar run --service literev --cmd $CMD --options --rm --env DJANGO_SUPERUSER_PASSWORD=$DJANGO_SUPERUSER_PASSWORD --env DJANGO_SUPERUSER_USERNAME=$DJANGO_SUPERUSER_USERNAME
          else
            cd ./src/
            export POSTGRES_HOST=localhost
            $CMD
          fi

      makemigrations:
        help: Run django makemigrations command (just for development)
        args:
          check:
            help: |
              Just check if the latest migration files were already created.
            type: bool
            action: store_true
        run: |
          sugar ext start \
            --services literev-postgres --options -d

          CWD=$(pwd)
          CMD_FLAG="${{ '--check' if args.check else '' }} --no-input"

          for app in 'literev'; do
            echo -e "\nMaking migration files for: '${app}' ...\n"

            CMD="python manage.py makemigrations ${CMD_FLAG} ${app}"

            if [[ "${{ env.USE_CONTAINER }}" == "true" ]]; then
              sugar run --service literev --options --rm --cmd $CMD
            else
              cd "${CWD}/src/"
              export POSTGRES_HOST=localhost
              $CMD
            fi
          done

          echo "[II] literev-postgres is running."

      migrate:
        help: Migrate regarding to the current migration files
        env-file: .env
        run: |
          sugar ext start \
            --services literev-postgres --options -d

          CMD="python manage.py migrate --no-input"

          if [[ "${{ env.USE_CONTAINER }}" == "true" ]]; then
            sugar run --service literev --options --rm --cmd $CMD
          else
            cd ./src/
            export POSTGRES_HOST=localhost
            $CMD
          fi
          echo "[II] literev-postgres is running."

      runserver:
        help: Run the django application
        env-file: .env
        args:
          plus:
            help: Run runserver command with additionally resources.
            type: bool
            action: store-true
        run: |
          sugar ext restart --services literev --options -d
          {% if args.plus %}
          CMD="python manage.py runserver_plus 0.0.0.0:8000"
          {% else %}
          CMD="python manage.py runserver 0.0.0.0:8000"
          {% endif %}

          if [[ "${{ env.USE_CONTAINER }}" == "true" ]]; then
            sugar run --service literev --options --rm
          else
            cd src
            export POSTGRES_HOST=localhost
            $CMD
          fi

      optimize-documents:
        help: Run the optimization of the documents
        env-file: .env
        run: |
          sugar ext start \
            --services literev-postgres --options -d

          CMD="python manage.py optimize_documents"

          if [[ "${{ env.USE_CONTAINER }}" == "true" ]]; then
            sugar run --service literev --options --rm --cmd $CMD
          else
            cd ./src/
            export POSTGRES_HOST=localhost
            $CMD
          fi
          echo "[II] The optimization of the documents is done."

      fetch-documents:
        help: Run the optimization of the documents
        env-file: .env
        run: |
          sugar ext start \
            --services literev-postgres --options -d

          CMD="python manage.py fetch_documents"

          if [[ "${{ env.USE_CONTAINER }}" == "true" ]]; then
            sugar run --service literev --options --rm --cmd $CMD
          else
            cd ./src/
            export POSTGRES_HOST=localhost
            $CMD
          fi
          echo "[II] Access to DB granted."

      optimize-documents-local:
        help: Run the optimization of the documents (temporary)
        env-file: .env
        run: |
          export POSTGRES_HOST=localhost
          cd ./src/
          python manage.py optimize_documents
          echo "[II] The optimization of the documents is done."

      notebook:
        help: Run the django environment in a jupyter notebook
        env-file: .env
        run: |
          export POSTGRES_HOST=localhost
          python src/manage.py shell_plus --lab

      shell:
        help: Run the Django console interpreter inside the container.
        env-file: .env
        run: |
          export POSTGRES_HOST=localhost
          python src/manage.py shell

  containers:
    tasks:
      wait:
        args:
          timeout:
            help: Specify the timeout for waiting the services
            type: integer
            default: 90
          service:
            help: Specify the service to be awaited
            type: string
            required: true
        run: timeout ${{ args.timeout }} ./containers/healthcheck.sh ${{ args.service }}

      wait-all:
        help: wait for all services
        run: |
          makim containers.wait --service literev-postgres
          makim containers.wait --service literev

      host-setup:
        help: Prepare the host for running the containers
        env-file: .env
        run: |
          mkdir -p ${LITEREV_CACHE_DIR}
          mkdir -p ${DOCKER_VOLUME_CONTAINER_PATH}
          mkdir -p ${POSTGRES_DATA}
          mkdir -p ${STATIC_ROOT}
          sudo chown -R ${HOST_UID}:${HOST_GID} ${STATIC_ROOT}

      postgres-database-backup:
        shell: bash
        args:
          container-name:
            help: Specify the name of the container
            type: string
            required: True
          path:
            help: Specify the path for the backup
            type: string
            required: false
            default: "/opt/data/backup-literev"
          dump-name:
            help: Specify the name for the dump file
            type: string
            required: false
            default: "literev-legal-$(date +%d-%m-%y_%H-%M).sql.gz"
        run: |
          # Function to validate IP address
          validate_ip() {
              local IP=$1
              if [[ $IP =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                  echo "Valid IP address: $IP"
                  return 0
              else
                  return 1
              fi
          }

          # Get IP address
          POSTGRES_HOST=$(python scripts/get_ip_address.py "${{ args.container_name }}")

          # Check if IP address is valid
          if ! validate_ip "$POSTGRES_HOST"; then
              echo "Failed to retrieve valid IP address. Check container status."
              exit 1
          else
              echo "Backup name: '${{ args.path }}/${{ args.dump_name }}'"
              PGPASSWORD="${{ env.POSTGRES_PASSWORD }}" \
              pg_dump -h "$POSTGRES_HOST" -p 35432 -U "${{ env.POSTGRES_USER }}" -d "${{ env.POSTGRES_DB_LITEREV }}" | \
              gzip > "${{ args.path }}/${{ args.dump_name }}"
          fi

      postgres-database-restore:
        shell: bash
        args:
          container-name:
            help: Specify the name of the container
            type: string
            required: True
          dump-file:
            help: Specify the path of the database dump file to restore
            type: string
            required: true
        run: |
          # Function to validate IP address
          validate_ip() {
              local IP=$1
              if [[ $IP =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                  echo "Valid IP address: $IP"
                  return 0
              else
                  return 1
              fi
          }

          # Get IP address from the specified container
          POSTGRES_HOST=$(python scripts/get_ip_address.py "${{ args.container_name }}")

          # Check if IP address is valid
          if ! validate_ip "$POSTGRES_HOST"; then
              echo "Failed to retrieve valid IP address. Check container status."
              exit 1
          fi

          echo "[II] Preparing to restore database..."

          # Set environment variable for PostgreSQL password
          export PGPASSWORD="${{ env.POSTGRES_PASSWORD }}"

          # Prepare command to drop the existing database if it exists
          DROP_CMD="psql -v ON_ERROR_STOP=1 --host=$POSTGRES_HOST -U "${{ env.POSTGRES_USER }}" \
          -p "${{ env.POSTGRES_PORT }}" -c 'DROP DATABASE IF EXISTS literev;'"

          # Execute the drop database command
          echo "Attempting to drop the existing 'literev' database..."
          eval $DROP_CMD

          # Command to create the database if it does not exist
          CREATE_CMD="psql -v ON_ERROR_STOP=1 --host=$POSTGRES_HOST -U "${{ env.POSTGRES_USER }}" \
          -p "${{ env.POSTGRES_PORT }}" -c 'CREATE DATABASE literev WITH OWNER literev;'"

          # Execute the create database command
          echo "Creating the 'literev' database with owner 'literev'..."
          eval $CREATE_CMD

          # Construct the psql command for restoring the database
          PSQL_CMD="psql -v ON_ERROR_STOP=1 --host=$POSTGRES_HOST -U "${{ env.POSTGRES_USER }}" \
          -p "${{ env.POSTGRES_PORT }}" -d literev"

          # Gunzip the database dump and restore it
          echo "Restoring database from dump file..."
          gunzip -c "${{ args.dump_file }}" | $PSQL_CMD
          echo "Database restored successfully."

  nginx:
    tasks:
      proxydomain:
        help: Create SSL proxy configuration with CertBot for a domain
        env-file: .env
        run: |
          python ./containers/nginx/scripts/generate_proxy_ui.py
      generate-certificate:
        help: Generate certificate
        run: |
          ./scripts/generate-certificates.sh
      setup:
        dependencies:
          - task: nginx.proxydomain
          - task: nginx.generate-certificate

  elasticsearch:
    tasks:
      index-json:
        help: Load normalized sample data to Elasticsearch
        env-file: .env
        args:
          index-name:
            help: Specify the index name
            type: string
            required: false
            default: "test_judiciary"
          raw-jsonl:
            help: Specify the original JSON file path
            type: string
            required: false
            default: "/opt/data/json_raw/output.jsonl"
          final-jsonl:
            help: Specify the final JSON file path
            type: string
            required: false
            default: "/opt/data/json_raw/judiciary_data.jsonl"
        shell: bash
        run: |
          CMD=$(python scripts/index_to_elasticsearch.py "${{ args.index_name }}" "${{ args.raw_jsonl }}" "${{ args.final_jsonl }}")
      
          echo "Indexing to Elasticsearch..."
          if [[ "${{ CMD }}" == "true" ]]; then
            echo "Indexing to Elasticsearch is done."
          else
            echo "Indexing to Elasticsearch failed."
          fi

  release:
    vars:
      app: |
        npx --yes \
          -p semantic-release \
          -p conventional-changelog-conventionalcommits \
          -p "@semantic-release/commit-analyzer" \
          -p "@semantic-release/release-notes-generator" \
          -p "@semantic-release/changelog" \
          -p "@semantic-release/exec" \
          -p "@semantic-release/github" \
          -p "@semantic-release/git" \
          -p "semantic-release-replace-plugin@1.2.7" \
          semantic-release

    tasks:
      ci:
        help: run semantic release on CI
        run: ${{ vars.app }} --ci

      dry:
        help: run semantic release in dry-run mode
        run: |
          ${{ vars.app }} --dry-run
