services:
  es-legal-1:
    container_name: es-legal-1
    hostname: es-legal-1
    image: docker.elastic.co/elasticsearch/elasticsearch:${ES_STACK_VERSION}
    user: "1000:1000"
    env_file:
      - ../.env
    environment:
      - node.name=es-legal-1
      - cluster.name=docker-cluster
      - discovery.seed_hosts=es-legal-1,es-legal-2,es-legal-3
      # Assign roles explicitly to reduce overhead.
      - node.roles=master,data,data_hot,ingest,ml,transform
      - xpack.security.enabled=false
      - action.destructive_requires_name=true
      # Disk watermark protections
      - cluster.routing.allocation.disk.watermark.low=75%
      - cluster.routing.allocation.disk.watermark.high=85%
      - cluster.routing.allocation.disk.watermark.flood_stage=95%
      - cluster.info.update.interval=1m
      # Cluster formation and data safety
      - gateway.recover_after_data_nodes=2
      - gateway.expected_data_nodes=3
      # Heap dump on crash
      - ES_JAVA_OPTS=-XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/usr/share/elasticsearch/data
      # Snapshot repo path
      - path.repo=/usr/share/elasticsearch/snapshots
    ulimits:
      memlock:
        soft: -1
        hard: -1
    mem_limit: 2g
    volumes:
      - esdata1:/usr/share/elasticsearch/data
      - es_snapshots:/usr/share/elasticsearch/snapshots
    ports:
      - "9200:9200"
    depends_on:
      - es-legal-2
      - es-legal-3
    healthcheck:
      test:
        ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 120
    restart: always
    networks:
      literev:
        aliases:
          - es-legal-1

  es-legal-2:
    container_name: es-legal-2
    hostname: es-legal-2
    image: docker.elastic.co/elasticsearch/elasticsearch:${ES_STACK_VERSION}
    user: "1000:1000"
    env_file:
      - ../.env
    environment:
      - node.name=es-legal-2
      - cluster.name=docker-cluster
      - discovery.seed_hosts=es-legal-1,es-legal-2,es-legal-3
      # Assign roles explicitly to reduce overhead.
      - node.roles=master,data,data_hot,ingest,ml,transform
      - xpack.security.enabled=false
      - action.destructive_requires_name=true
      # Disk watermark protections
      - cluster.routing.allocation.disk.watermark.low=75%
      - cluster.routing.allocation.disk.watermark.high=85%
      - cluster.routing.allocation.disk.watermark.flood_stage=95%
      - cluster.info.update.interval=1m
      # Cluster formation and data safety
      - gateway.recover_after_data_nodes=2
      - gateway.expected_data_nodes=3
      # Heap dump on crash
      - ES_JAVA_OPTS=-XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/usr/share/elasticsearch/data
      # Snapshot repo path
      - path.repo=/usr/share/elasticsearch/snapshots
    ulimits:
      memlock:
        soft: -1
        hard: -1
    mem_limit: 2g
    volumes:
      - esdata2:/usr/share/elasticsearch/data
      - es_snapshots:/usr/share/elasticsearch/snapshots
    healthcheck:
      test:
        ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 120
    restart: always
    networks:
      literev:
        aliases:
          - es-legal-2

  es-legal-3:
    container_name: es-legal-3
    hostname: es-legal-3
    image: docker.elastic.co/elasticsearch/elasticsearch:${ES_STACK_VERSION}
    user: "1000:1000"
    env_file:
      - ../.env
    environment:
      - node.name=es-legal-3
      - cluster.name=docker-cluster
      - discovery.seed_hosts=es-legal-1,es-legal-2,es-legal-3
      # Assign roles explicitly to reduce overhead.
      - node.roles=master,data,data_hot,ingest,ml,transform
      - xpack.security.enabled=false
      - action.destructive_requires_name=true
      # Disk watermark protections
      - cluster.routing.allocation.disk.watermark.low=75%
      - cluster.routing.allocation.disk.watermark.high=85%
      - cluster.routing.allocation.disk.watermark.flood_stage=95%
      - cluster.info.update.interval=1m
      # Cluster formation and data safety
      - gateway.recover_after_data_nodes=2
      - gateway.expected_data_nodes=3
      # Heap dump on crash
      - ES_JAVA_OPTS=-XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/usr/share/elasticsearch/data
      # Snapshot repo path
      - path.repo=/usr/share/elasticsearch/snapshots
    ulimits:
      memlock:
        soft: -1
        hard: -1
    mem_limit: 2g
    volumes:
      - esdata3:/usr/share/elasticsearch/data
      - es_snapshots:/usr/share/elasticsearch/snapshots
    healthcheck:
      test:
        ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 120
    restart: always
    networks:
      literev:
        aliases:
          - es-legal-3

  es-legal-setup:
    image: curlimages/curl:8.13.0
    depends_on: [es-legal-1]
    command: >
      sh -c '
        echo "[*] Waiting for cluster readiness..." &&
        until curl -u elastic:${ES_PASSWORD} -s http://es-legal-1:9200/_cluster/health?wait_for_status=yellow; do sleep 2; done &&
        echo "[*] Disabling ILM..." &&
        curl -u elastic:${ES_PASSWORD} -X POST http://es-legal-1:9200/_ilm/stop &&
        echo "[*] Blocking write/deletion on core indexes..." &&
        for idx in chambre_penale chambre_civile chambre_administrative; do
          curl -u elastic:${ES_PASSWORD} -X PUT http://es-legal-1:9200/$$idx/_settings -H "Content-Type: application/json" \
            -d "{\"index.blocks.write\": true, \"index.blocks.read_only_allow_delete\": false}"
        done
      '
    networks:
      - literev

  es-restore:
    image: python:3.12-slim
    container_name: es-restore
    command: >
      sh -c "
        pip install --no-cache-dir requests &&
        while true; do
          python /app/restore_if_missing.py;
          sleep 60;
        done
      "
    volumes:
      - ./elasticsearch_restore:/app
    environment:
      - ES_URL=http://es-legal-1:9200
      - SNAPSHOT_REPO=literev_backup
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
    depends_on:
      - es-legal-1
    networks:
      - literev
    restart: always

volumes:
  esdata1:
    driver: local
    name: es_legal_data_1
  esdata2:
    driver: local
    name: es_legal_data_2
  esdata3:
    driver: local
    name: es_legal_data_3

  es_snapshots:
    driver: local
    name: es_legal_snapshots

networks:
  literev:
