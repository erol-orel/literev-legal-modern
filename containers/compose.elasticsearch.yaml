services:
  elasticsearch:
    hostname: elasticsearch
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.1
    user: "1000:1000" # Required UID and GID for Elasticsearch permissions
    env_file:
      ../.env
    environment:
      - node.name=es-legal
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - bootstrap.memory_lock=false
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - esdata:/usr/share/elasticsearch/data
    ports:
      - ${ES_PORT:-9200}:${ES_PORT:-9200}
    networks:
      - literev
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:${ES_PORT:-9200}/_cluster/health || exit 1"]  # Use HTTP for healthcheck
      interval: 10s
      timeout: 10s
      retries: 120

volumes:
  esdata:
    driver: local
    name: es_legal_data

networks:
  literev:
