upstream {{ upstream_name }} {
	server {{ upstream_service }}:{{ upstream_port }};
}

server {
	server_name 		{{ domain }} www.{{ domain }};

	listen       		80 			default_server;
	server_tokens off;

	location /.well-known/acme-challenge/ {
		allow all;
  		root {{ certbot_root }};
	}

	location / {
		return 301 https://$host$request_uri;
	}

}

server {
	server_name 		{{ domain }} www.{{ domain }};
	server_tokens off;

	listen		443 		ssl;
	http2 on;

	charset 							utf-8;
	client_max_body_size 				75M;
	proxy_headers_hash_max_size 1024;
	proxy_headers_hash_bucket_size 128;

	location /.well-known/acme-challenge/ {
		allow all;
  		root {{ certbot_root }};
	}

	location /static {
		alias /usr/share/nginx/html/{{ domain }}/static;
	}

	location / {
		proxy_pass 			http://{{ upstream_name }};
		proxy_set_header 	Host 		$http_host;
		proxy_set_header 	X-Real-IP 	$remote_addr;
		proxy_set_header 	X-Forwarded-For 	$proxy_add_x_forwarded_for;
		proxy_set_header 	X-Forwarded-Proto 	$scheme;
		proxy_set_header 	X-Forwarded-Proto 	https;
		proxy_set_header 	X-Forwarded-Port 	443;
		proxy_headers_hash_max_size 1024;
		proxy_headers_hash_bucket_size 128;
	}

	location = /hactar {
		return 301 /hactar/;
	}

	location /hactar/ {
		proxy_pass          https://hactar.unige.ch/;
		proxy_ssl_verify    off;
		proxy_set_header    Host            hactar.unige.ch;
		proxy_set_header    X-Real-IP       $remote_addr;
		proxy_read_timeout  120s;

		# Disable upstream compression so sub_filter can rewrite response bodies
		proxy_set_header    Accept-Encoding "";

		# Rewrite absolute paths to be relative to /hactar/
		sub_filter          'href="/'       'href="/hactar/';
		sub_filter          'src="/'        'src="/hactar/';
		sub_filter          'import("/'     'import("/hactar/';
		sub_filter          'from "/'       'from "/hactar/';
		sub_filter          'base: ""'      'base: "/hactar"';
		sub_filter_once     off;
		sub_filter_types    text/html application/javascript application/json;
	}

	location /jupyter/ {
		proxy_pass http://literev-jupyter:8888/jupyter/;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_read_timeout 86400;
		proxy_buffering off;
	}

	ssl_certificate {{ letsencrypt_root }}/live/{{ domain  }}/fullchain.pem;
    ssl_certificate_key {{ letsencrypt_root }}/live/{{ domain  }}/privkey.pem;
    include /etc/nginx/conf.d/options-ssl-nginx.conf;

	# Add a redirect to the non-www version
    if ($host = www.{{ domain }}) {
        return 301 https://{{ domain }}$request_uri;
    }
}
