services:
  literev:
    user: "literev:literev"
    command: /opt/start.sh
    environment:
      DEBUG: 0

  literev-postgres:
    environment:
      DEBUG: 1
    volumes:
      - ${POSTGRES_DATA}:/var/lib/postgresql/data
      - ${POSTGRES_HOST_BACKUP}:${CONTAINER_VOLUME_DATA_DIR}/backup

  literev-nginx:
    hostname: literev-nginx
    image: nginx:1.25.3
    env_file:
      - ../.env
    restart: unless-stopped
    ports:
      - 443:443
      - 80:80
    networks:
      - literev
    volumes:
      - static_root:/usr/share/nginx/html/${CERTBOT_DOMAIN}/static
      - ${NGNIX_CONF}:/etc/nginx/conf.d
      - ${CERTBOT_CONF}:/etc/letsencrypt
      - ${CERTBOT_WWW}:/var/www/certbot
    # command: sets a loop which reloads nginx each 6 hours
    # ensures nginx will always have fresh certificates files
    command: >
      /bin/sh -c 'while :; do
        sleep 6h & wait $${!};
        nginx -s reload;
      done &
      nginx -g "daemon off;"'
    depends_on:
      - literev
    healthcheck:
      test: ["CMD-SHELL", "curl -fk https://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 10

  certbot:
    image: certbot/certbot:v2.7.4
    restart: unless-stopped
    volumes:
      - ${CERTBOT_CONF}:/etc/letsencrypt
      - ${CERTBOT_WWW}:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    env_file:
      - ../.env
    depends_on:
      - literev-nginx

volumes:
  static_root:
