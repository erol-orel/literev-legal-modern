services:
  literev-base:
    # TODO(#113): Consider refactoring the Dockerfile to avoid creating directories
    # during the build process. This can lead to unnecessary layers and
    # image size. Instead, create these directories at runtime or in the
    # entrypoint script to ensure they are always created when needed.
    restart: unless-stopped
    stdin_open: true
    tty: true
    env_file:
      - ../.env
    build:
      context: ..
      dockerfile: containers/literev/Dockerfile
      args:
        # note: if you want to use a specific UID and GID, ensure to add it to
        #       the .env file
        # TODO: Check CACHEDIR
        - UID=${HOST_UID:-1000}
        - GID=${HOST_GID:-1000}
        - ENV=${ENV:-prod}
        - CONTAINER_VOLUME_DATA_DIR=${CONTAINER_VOLUME_DATA_DIR}
        - STATIC_ROOT=${STATIC_ROOT:-/tmp/literev/static}
        - MEDIA_ROOT=${DJANGO_MEDIA_ROOT:-/tmp/literev/media}
        - HTTP_PROXY=${http_proxy}
        - HTTPS_PROXY=${https_proxy}
        - LITEREV_CACHE_DIR=${LITEREV_CACHE_DIR:-/opt/data/literev/cache}

    user: "literev:literev"

  literev:
    extends: literev-base
    hostname: literev
    env_file:
      - ../.env
    environment:
      DJANGO_PORT: 8000
    ports:
      - ${FRONTEND_HOST_PORT}:8000
    depends_on:
      - literev-postgres
      - literev-ollama
    volumes:
      - container_data_dir:${CONTAINER_VOLUME_DATA_DIR}
      - static_root:${STATIC_ROOT:-/tmp/literev/static}
      - media_root:${DJANGO_MEDIA_ROOT:-/tmp/literev/media}
      - llm_cache:${LITEREV_CACHE_DIR:-/opt/data/literev/cache}
    networks:
      - literev
    healthcheck:
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 40s # requires docker-compose 3.4
      test:
        ["CMD", "curl", "-f", "http://localhost:${DJANGO_PORT:-8000}/status/"]

  literev-postgres:
    hostname: literev-postgres
    # restart: unless-stopped
    build:
      context: ..
      dockerfile: containers/postgresql/Dockerfile
      args:
        HOST_UID: ${HOST_UID}
        HOST_GID: ${HOST_GID}
    env_file:
      - ../.env
    ports:
      - ${POSTGRES_PORT}:${POSTGRES_PORT}
    networks:
      - literev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p ${POSTGRES_PORT} -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    command: postgres -p ${POSTGRES_PORT}

  literev-celery:
    extends: literev-base
    hostname: literev-celery
    command: >
      celery -A config worker -l INFO
      --pool=threads --concurrency=${CELERY_WORKER_CONCURRENCY:-4}
    env_file:
      - ../.env
    depends_on:
      literev-redis:
        condition: service_healthy
      literev-postgres:
        condition: service_started
      literev-ollama:
        condition: service_healthy
    volumes:
      - container_data_dir:${CONTAINER_VOLUME_DATA_DIR}
      - static_root:${STATIC_ROOT:-/tmp/literev/static}
      - media_root:${DJANGO_MEDIA_ROOT:-/tmp/literev/media}
      - llm_cache:${LITEREV_CACHE_DIR:-/opt/data/literev/cache}
    networks: [literev]

  literev-redis:
    image: redis:7-alpine
    hostname: literev-redis
    networks:
      literev:
        aliases: [literev-redis]
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ../containers/redis/config:/usr/local/etc/redis
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 2048M
        reservations:
          cpus: "0.25"
          memory: 1024M
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "--user",
          "app",
          "--pass",
          "${REDIS_PASSWORD}",
          "PING",
        ]
      interval: 5s
      timeout: 2s
      retries: 20

  literev-ollama:
    image: ollama/ollama:0.4.2
    hostname: literev-ollama
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - 127.0.0.1:${OLLAMA_HOST_PORT:-11434}:11434
    volumes:
      - ollama_models:/root/.ollama
    networks: [literev]
    deploy:
      resources:
        limits:
          memory: 20480M
        reservations:
          memory: 16384M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s
    entrypoint:
      [
        "/bin/sh",
        "-c",
        "ollama serve & OLLAMA_PID=$! && sleep 5 && ollama pull ${OLLAMA_MODEL:-mistral:7b} && wait $OLLAMA_PID",
      ]

  literev-jupyter:
    extends: literev-base
    volumes:
      - llm_cache:${LITEREV_CACHE_DIR:-/opt/data/literev/cache}
    networks: [literev]

volumes:
  container_data_dir:
  static_root:
  media_root:
  llm_cache:
  redis_data:
  ollama_models:

networks:
  literev:
# NETWORKS
# networks allows services to resolve composeother services
# by their hostnames example: literev, literev-postgres, etc.
# server literev:8000; resolves to server  xxx.x.x.x:8000;
