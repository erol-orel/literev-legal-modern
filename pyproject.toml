[build-system]
requires = ["setuptools>=70.1.0,<80.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "literev"
version = "0.12.0"  # semantic-release
description = "scientific tool"
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [
  {name = "Aziza", email = "FatmaAziza.Merzouki@unige.ch"},
  {name = "Erol", email = "Erol.Orel@unige.ch"},
]

dependencies = [
  "elasticsearch >=8.12.1,<9.0.0",
  "django >=5.0.3",
  "django-allauth >=0.61.0",
  "django-environ >=0.10.0",
  "django-stubs[compatible-mypy] >=5.1",
  "django-stubs-ext >=5.1",
  "psycopg2-binary >=2.9.9",
  "celery >=5.3.6",
  "redis >=5.0.3",
  "scikit-learn >=1.5.0", # NumPy 2 support
  "spacy >=3.8.0,<3.9",
  "pip >=24.0",
  "lingua-language-detector >=2.0.2",
  "hdbscan >=0.8.33",
  "optuna >=3.6.1",
  "pacmap >=0.7.2",
  "bokeh >=3.4.0",
  "pandas >=2.2.2", # recent pandas plays nicer with NumPy 2
  "scipy >=1.14.0", # NumPy 2 compatible
  "openai >=1.20.0",
  "tiktoken >=0.8.0",
  "tbb >=2021.12.0",
  "distinctipy >=1.3.4",
  "matplotlib >=3.9.2",
  "werkzeug >=3",
  "djangorestframework >=3.15.2",
  "rago[base,ollama] >=0.14.3,<0.14.5", # 0.14.5 renamed generate(context=) to generate(data=)
  "litellm>=1.0.0",
  "langchain >=0.3.6,<0.4.0",
  "django-filter >=24.3",
  "jsbeautifier ==1.15.1",
  "blis <1.2",
  "numpy >=2", # align with rago
  "torch >=2.5.1",
  "torchvision >=0.20.0",
  "ragas >=0.2.14",
  "sentry-sdk >=2.27.0,<3.0.0",
  "ollama >=0.4.7,<0.5.0",
  "requests >=2.32.3,<3.0.0",
  "tqdm >=4.67.1,<5.0.0",
  "backoff >=2.2.1,<3.0.0",
  "chromadb ==1.3.4",
  "rapidfuzz >=3.14.3",
]

[project.optional-dependencies]
dev = [
  "pytest >=8.3.3",
  "pytest-cov >=5",
  "pytest-django >=4.9.0",
  "pre-commit >=3.0.0",
  "bandit >=1.7.5",
  "compose-go >=2.23.0",
  "containers-sugar[tui] ==1.19.2",
  "django-debug-toolbar >=4.1.0",
  "django-extensions >=3.2.3",
  "djlint >=1.32.1",
  "ipython >=8.14.0",
  "jupyter >=1",
  "jupyterlab >=4.1.4",
  "makim ==1.27.0",
  "mccabe >=0.7.0",
  "mypy >=1.11.2",
  "notebook >=6.5.4",
  "pdbpp >=0.10.3",
  "ruff >=0.1.5",
  "vulture >=2.7",
  "django-coverage-plugin >=3.1",
  "djangorestframework-stubs ==3.14.2",
  "pytest-rerunfailures >=15",
  # build/publish tools if you want to keep them here:
  "build >=1.3.0",
  "twine >=6.1.0",
]

[project.urls]
Homepage = "https://github.com/your-org-or-user/literev"
Issues = "https://github.com/your-org-or-user/literev/issues"

# --- setuptools (src-layout) ---
[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

# Prefer the inline 'find' form to prevent accidental extra keys
[tool.setuptools.packages]
find = { where = ["src"], include = ["literev*", "literev_core*"] }

# Ensure non-Python files land in the wheel
[tool.setuptools.package-data]
literev = [
  "templates/**/*.html",
  "templates/**/*.txt",
  "templates/**/*.json",
  "migrations/*.py",
  "static/**",
]
literev_core = ["data/**"]

# ---------------- Tool configs (copied over) ----------------
[tool.pytest.ini_options]
minversion = "6.0"
DJANGO_SETTINGS_MODULE = "config.settings.test"
addopts = "--ds=config.settings.test -v -ra --cov=src --reuse-db"
pythonpath = "src"
python_files = ["tests.py", "test_*.py"]

[tool.coverage.run]
include = ["src/**"]
omit = [
  "*/migrations/*",
  "*/tests/*",
  "scripts/*",
  "manage.py",
  "*/src/conftest.py",
  "*.txt",
]
plugins = ["django_coverage_plugin"]

[tool.bandit]
exclude_dirs = ["tests", "migrations"]
targets = "src/"

[tool.vulture]
exclude = ["tests", "migrations", "scripts"]
ignore_decorators = []
ignore_names = []
make_whitelist = true
min_confidence = 80
paths = ["src/"]
verbose = false

[tool.ruff]
line-length = 79
force-exclude = true
src = ["./src"]
exclude = ["docs", "migrations", "urls.py", "scripts"]
fix = true

[tool.ruff.lint]
ignore = ["RUF012"]
select = ["F","YTT","RUF","I001"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
lines-between-types = 1

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
mypy_path = "src/backend/"
exclude = [
  'tests/*',
  'docs/*',
  # todo: fix the following files:
  'tableselect_workflows.py',
  'table_choice.py',
  'rag_pdf.py',
  'pipeline.py',
  'collectors.py',
]
plugins = [
  "pydantic.mypy",
  "mypy_django_plugin.main",
  "mypy_drf_plugin.main",
]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true

[[tool.mypy.overrides]]
ignore_errors = true
module = [
  "requests",
	"*.migrations.*",
]

[tool.django-stubs]
django_settings_module = "config.settings.test"
strict_settings = false  # todo: turn it to True in the future

[tool.djlint]
blank_line_after_tag="load,extends,include"
blank_line_before_tag="load,extends,include,block"
close_void_tags=true
format_attribute_template_tags=true
format_css=true
indent=2
line_break_after_multiline_tag=true
max_attribute_length=3
max_blank_lines=1
max_line_length=80
profile="django"
exclude="src/workflow/tests,.git,docs,.eggs,src/literev/templates/tags"
ignore="H029,H005,H030,H031,H006,H013,H021,H023,D018"
preserve_blank_lines=false

[tool.djlint.html]
indent_size=2

[tool.djlint.css]
indent_size=2

[tool.djlint.js]
indent_size=2
